{# Status shown with colour *and* text (FR-64: never colour alone). #}
<span class="inline-block rounded-full px-3 py-1 text-xs font-semibold
  {% if order.status == 'submitted' %}bg-amber-100 text-amber-900
  {% elif order.status == 'refunded' %}bg-slate-200 text-slate-800
  {% elif order.status == 'delivered' or order.status == 'field_report_delivered' %}bg-emerald-700 text-white
  {% else %}bg-sky-100 text-sky-900{% endif %}">{{ order.get_status_display }}</span>
